services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lettermaze
      POSTGRES_USER: lettermaze
      POSTGRES_PASSWORD: lettermaze
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lettermaze -d lettermaze"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
